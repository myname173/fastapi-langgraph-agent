<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Agent — Investor &amp; Coder</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="双模式 AI Agent：Investor 投资助手 + Coder 软件开发，同一登录态。" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- ============ Login / Register view ============ -->
    <section id="view-login" class="view">
      <div class="auth-card">
        <h1 class="auth-title">AI Agent</h1>
        <p class="auth-sub">Investor &amp; Coder · 同一登录态</p>

        <div class="tabs">
          <button type="button" class="tab active" data-authtab="login">登录</button>
          <button type="button" class="tab" data-authtab="register">注册</button>
        </div>

        <form id="form-login" class="auth-form">
          <label>邮箱
            <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          </label>
          <label>密码
            <input type="password" name="password" required minlength="8" autocomplete="current-password" placeholder="至少 8 位" />
          </label>
          <button type="submit" class="btn-primary">登录</button>
        </form>

        <form id="form-register" class="auth-form hidden">
          <label>用户名（可选）
            <input type="text" name="username" maxlength="50" autocomplete="name" placeholder="显示名" />
          </label>
          <label>邮箱
            <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          </label>
          <label>密码
            <input type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password" placeholder="至少 8 位" />
          </label>
          <button type="submit" class="btn-primary">注册</button>
        </form>

        <p id="auth-error" class="auth-error hidden"></p>
      </div>
    </section>

    <!-- ============ Main view ============ -->
    <section id="view-main" class="view hidden">
      <header class="topbar">
        <div class="brand">AI Agent</div>
        <nav class="switcher" role="tablist">
          <button type="button" id="tab-investor" class="switcher-btn" role="tab">📈 Investor</button>
          <button type="button" id="tab-coder" class="switcher-btn" role="tab">🧑‍💻 Coder</button>
        </nav>
        <button type="button" id="btn-logout" class="btn-ghost">退出</button>
      </header>
      <main id="content"></main>
    </section>
  </div>

  <!-- Zero-build: plain scripts (no modules, no bundler). Order matters. -->
  <script src="/vendor/md.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/investor.js"></script>
  <script src="/js/coder.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
