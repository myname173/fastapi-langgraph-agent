services:
  db:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # Valkey (Redis-compatible) cache — optional, set VALKEY_HOST=valkey in your .env to enable
  valkey:
    image: valkey/valkey:8.1.6-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - monitoring

  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    env_file:
      - .env.${APP_ENV:-production}
    # Docker secrets — real API key is mounted read-only at
    # /run/secrets/openai_api_key. config.py reads it via
    # OPENAI_API_KEY_FILE (set in .env.production). Falls back to
    # OPENAI_API_KEY env var for local `make dev` runs without Docker.
    secrets:
      - openai_api_key
    environment:
      - APP_ENV=${APP_ENV:-production}
      # L-15 fix: JWT_SECRET_KEY is intentionally NOT set here. Previously
      # this line had a predictable fallback ("supersecretkeythatshouldbe...")
      # which (a) is 47 chars so it PASSED config.py's >=32-char production
      # validation, and (b) overrode the real secret from .env.production
      # because the `environment:` section takes precedence over `env_file:`.
      # Now the value comes solely from .env.production (env_file above),
      # which is the single source of truth. If the key is missing,
      # config.py's production validator fails fast with a clear error.
    # Allow app container to access host's vLLM service (host.docker.internal:8001).
    # Required on Linux; Docker Desktop (Win/Mac) resolves this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring
    restart: always

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=h0dg7WRQ7zfYBz5vh7ARZQ
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: always

  # Streamlit Web UI — depends on the API service being healthy.
  # Deprecated as default entry: the zero-build static SPA (frontend/, served by
  # the app container at /) is now the primary web UI. Streamlit is kept as an
  # opt-in fallback — start with: docker compose --profile streamlit up ui
  ui:
    profiles: ["streamlit"]
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - UI_API_BASE_URL=http://app:8000
    volumes:
      - ./ui:/app/ui
      - ./.streamlit:/app/.streamlit
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - monitoring

  # Local vLLM inference service — Qwen2.5-1.5B-Instruct-GPTQ-Int4 (Phase B).
  # Phase B: upgraded from 0.5B FP16 to 1.5B GPTQ-Int4 (gptq_marlin kernel)
  # for stronger reasoning while staying within GTX 1650 Ti 4GB VRAM.
  # Note: vLLM serves ONE model at a time. We expose it under BOTH names
  # (local-qwen-1.5b AND local-qwen-0.5b) so that the existing
  # LLM_MODELS fallback chain in .env keeps resolving to local vLLM
  # (no automatic fallback to cloud during the Phase B cutover).
  # When Step 2 swaps LLM_MODELS order to put local-qwen-1.5b first,
  # this dual-name serving continues to work transparently.
  vllm:
    image: vllm/vllm-openai:v0.8.5
    init: true  # tini init process — reaps zombie children (fixes docker stop hang)
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Model weights pre-downloaded on host (container-internal download
      # fails due to proxy issues). Read-only mount for safety.
      - ../vllm-main/hf-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    command:
      - --model
      - /models/Qwen2.5-1.5B-Instruct-GPTQ-Int4
      # Phase B: dual-name serving — `local-qwen-0.5b` is the legacy
      # name still referenced by LLM_MODELS in .env; `local-qwen-1.5b`
      # will be promoted to primary in Step 2.
      - --served-model-name
      - local-qwen-1.5b
      - local-qwen-0.5b
      # vLLM 0.8.5 quirk: when config.json has use_exllama=true +
      # exllama_config.version=1, vLLM's ModelConfig normalizes the
      # internal quantization field to 'gptq_marlin' (its preferred
      # kernel) but then strict-validates against the literal
      # quant_method='gptq' in config.json and raises ValueError.
      # Passing --quantization gptq explicitly forces the exllama v1
      # code path which matches config.json's quant_method.
      - --quantization
      - gptq
      - --gpu-memory-utilization
      - "0.88"
      - --max-model-len
      - "1536"              # Phase B: 2048→1536 (1.5B GPTQ KV cache larger)
      - --max-num-seqs
      - "2"                 # single-user
      - --enforce-eager       # GTX 1650 Ti compatibility
      - --dtype
      - half
      - --port
      - "8001"
      - --enable-prefix-caching    # vLLM 0.8 default, declared explicitly
      - --enable-chunked-prefill   # works with prefix cache
      - --block-size
      - "16"                       # explicit default for future tuning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Phase B: 60→90 (1.5B GPTQ model load is slower than 0.5B FP16)
    restart: on-failure
    networks:
      - monitoring

  # ===================================================================
  # MCP Server — read-only git context + sqlite query sidecar
  # -------------------------------------------------------------------
  # CPU-only service (zero GPU cost). Gives coder/tester agents git
  # introspection (log/show/branch/status/diff) and read-only SDLC task
  # history queries via the Model Context Protocol.
  #
  # Safety: workspace is mounted read-only (":ro") so the MCP server
  # physically cannot mutate the repo. The sqlite connection is opened
  # with mode=ro at the sqlite level. No write tools are exposed.
  #
  # Opt-in: set ENABLE_MCP_CLIENT=true + MCP_SERVER_URLS in .env to make
  # the app load tools from this server on startup. If this container is
  # down, the app degrades gracefully (non-fatal skip, cloud fallback).
  # ===================================================================
  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      # Read-only workspace mount — git tools can observe but never mutate.
      # If ./workspace doesn't exist on host, docker creates an empty dir;
      # git tools return a friendly "not a git repository" error at call time.
      - ./workspace:/workspace:ro
      # Persistent sqlite storage (seed data survives restarts).
      - mcp_data:/data
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - MCP_WORKSPACE_ROOT=/workspace
      - MCP_DB_PATH=/data/mcp.db
    healthcheck:
      # mcp_server/Dockerfile is python:3.13-slim (no curl). Use a
      # socket probe — the streamable-http endpoint accepts POST only,
      # so a GET-based check would return 405 and false-negative.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - monitoring

  # ===================================================================
  # Cloudflare Tunnel — 免费公网 HTTPS 入口（opt-in，需显式启用）
  # -------------------------------------------------------------------
  # 启动方式：
  #   docker compose --profile tunnel up
  #
  # 两种模式：
  #   A) 快速隧道（默认，无需 Cloudflare 账号）：
  #      - 启动后查看日志获取随机域名：docker compose logs cloudflared
  #      - 日志中会出现 "https://*.trycloudflare.com" 链接
  #      - 注意：每次重启 URL 会变，需同步更新 ALLOWED_ORIGINS
  #
  #   B) 命名隧道（持久 URL，需 Cloudflare 账号）：
  #      1. 访问 https://one.dash.cloudflare.com/ → Networks → Tunnels 创建隧道
  #      2. 在 .env.production 设置 CLOUDFLARE_TUNNEL_TOKEN=<你的 token>
  #      3. 将下方 command 替换为：tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #      4. 在 Cloudflare 控制台绑定子域名 → http://app:8000
  # ===================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # Quick tunnel mode (temporary, URL changes on restart).
    # For persistent URL, switch to: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - monitoring
    restart: on-failure

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
  valkey-data:
  mcp_data:

# Docker secrets — file-based credential injection (read-only in container).
# The source file on the host is gitignored (see secrets/.gitignore).
# Inside the container the secret is available at /run/secrets/<name>.
secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
